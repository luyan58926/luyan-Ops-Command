<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卢女开 · IT运维指挥台 | LY Ops Command</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- ===== 顶部栏 ===== -->
  <header id="topbar">
    <div class="brand">
      <div class="brand-logo">LY</div>
      <div class="brand-text">
        <div class="brand-name">卢女开 · IT运维指挥台</div>
        <div class="brand-sub">全国派单 · 任务闭环 · 绩效管理</div>
      </div>
    </div>
    <div class="topbar-center">
      <div class="global-search">
        <span class="gs-icon">⌕</span>
        <input id="globalSearchInput" type="text" placeholder="搜索职场 / 城市 / 工程师 / 联系人 / 电话 / 派单号…">
        <div id="searchDropdown" class="search-dropdown hidden"></div>
      </div>
    </div>
    <div class="topbar-right">
      <div id="modeSwitch" class="mode-switch" title="切换工作模式 / 作品演示模式">
        <span class="mode-dot"></span><span id="modeLabel">工作模式</span>
      </div>
      <button id="assistantBtn" class="topbar-btn" title="花姐助手">✦ 花姐助手</button>
      <div class="user-chip">花姐</div>
    </div>
  </header>

  <div id="layout">
    <!-- ===== 侧边栏 ===== -->
    <nav id="sidebar">
      <div class="nav-group">
        <div class="nav-item" data-view="home"><span class="nav-ico">◉</span>今日指挥台</div>
        <div class="nav-item active" data-view="dispatch"><span class="nav-ico">⇶</span>派单中心<span id="navBadgeDispatch" class="nav-badge hidden">0</span></div>
        <div class="nav-item" data-view="tasks"><span class="nav-ico">☰</span>任务与告警<span id="navBadgeTasks" class="nav-badge hidden">0</span></div>
        <div class="nav-item" data-view="projects"><span class="nav-ico">▣</span>专项管理</div>
      </div>
      <div class="nav-group">
        <div class="nav-item" data-view="resources"><span class="nav-ico">◈</span>工程师与职场</div>
        <div class="nav-item" data-view="kpi"><span class="nav-ico">◬</span>KPI绩效</div>
        <div class="nav-item" data-view="reports"><span class="nav-ico">▤</span>交接与报表</div>
        <div class="nav-item" data-view="notes"><span class="nav-ico">📓</span>我的记录<span id="navBadgeNotes" class="nav-badge nav-badge-soft hidden">0</span></div>
      </div>
      <div class="nav-group nav-bottom">
        <div class="nav-item" data-view="import"><span class="nav-ico">⇅</span>数据导入导出</div>
        <div class="nav-item" data-view="settings"><span class="nav-ico">⚙</span>系统设置</div>
        <div class="nav-item" data-view="about"><span class="nav-ico">❖</span>项目说明</div>
      </div>
    </nav>

    <!-- ===== 主内容 ===== -->
    <main id="main">
      <div id="view-home" class="view"></div>
      <div id="view-dispatch" class="view hidden"></div>
      <div id="view-tasks" class="view hidden"></div>
      <div id="view-projects" class="view hidden"></div>
      <div id="view-resources" class="view hidden"></div>
      <div id="view-kpi" class="view hidden"></div>
      <div id="view-reports" class="view hidden"></div>
      <div id="view-notes" class="view hidden"></div>
      <div id="view-import" class="view hidden"></div>
      <div id="view-settings" class="view hidden"></div>
      <div id="view-about" class="view hidden"></div>
    </main>
  </div>

  <footer id="footer">
    <span>卢女开 · IT运维指挥台 <span class="footer-sub">LY Ops Command</span></span>
    <span>Designed by 卢女开</span>
  </footer>
</div>

<!-- 通用弹窗 -->
<div id="modalRoot" class="modal-root hidden"></div>
<!-- 花姐助手面板 -->
<div id="assistantPanel" class="assistant-panel hidden">
  <div class="ap-head">
    <span class="ap-avatar">✦</span>
    <div><div class="ap-name">花姐助手</div><div class="ap-status">在线 · 已读取 67 个职场 / 9 名工程师</div></div>
    <button id="apClose" class="ap-close">×</button>
  </div>
  <div id="apBody" class="ap-body"></div>
  <div class="ap-input-row">
    <input id="apInput" type="text" placeholder="问我：湖州谁负责？今天有什么超时？…">
    <button id="apSend" class="btn btn-primary btn-sm">发送</button>
  </div>
</div>

<div id="toastRoot" class="toast-root"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
